name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-eval.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          # Giá trị giả để config.py không lỗi khi import — bộ test đã mock
          # toàn bộ lời gọi API/DB thật (xem tests/conftest.py), không cần
          # key/DB thật để chạy CI.
          PG_USER: ci_user
          PG_PASSWORD: ci_password
          GOOGLE_API_KEY: ci-fake-key
          COHERE_API_KEY: ci-fake-key
        run: pytest -v

      - name: Run RAG evaluation
        env:
          PG_USER: ci_user
          PG_PASSWORD: ci_password
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python evaluation/evaluate_rag.py

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: evaluation/evaluation_results.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
